spring.application.name=karcliq-rag

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.model=gpt-4o-mini
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.max-tokens=512
spring.ai.openai.chat.temperature=0.2
spring.ai.openai.chat.top-p=0.9
spring.ai.openai.embedding.options.model=text-embedding-3-small

# Database configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/karcliq-rag
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# Logging configuration
logging.level.root=INFO
logging.level.com.karcliq.rag=DEBUG
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Enable automatic schema creation so Spring AI creates the vector_store table
spring.ai.vectorstore.pgvector.initialize-schema=true
